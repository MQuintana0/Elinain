# Blueprint de Render para el backend Elinain.
# La base de datos vive en Neon; solo se referencia su URL (sin secretos en el repo).
services:
  - type: web
    name: elinain
    runtime: node
    buildCommand: pnpm install --frozen-lockfile && pnpm run build
    startCommand: node dist/main.js
    healthCheckPath: /health
    envVars:
      # Entorno de ejecución en producción.
      - key: NODE_ENV
        value: production
      # URL pooled de Neon para el runtime (se configura en el dashboard de Render).
      - key: DATABASE_URL
        sync: false
