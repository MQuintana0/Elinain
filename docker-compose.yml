services:
  db:
    image: postgis/postgis:16-3.5
    container_name: elinain-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: elinain_admin
      POSTGRES_PASSWORD: elinain_admin
      POSTGRES_DB: elinain
      POSTGRES_RUNTIME_USER: elinain_runtime
      POSTGRES_RUNTIME_PASSWORD: elinain_runtime
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U elinain_admin -d elinain']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
